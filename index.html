const DIFF_LABELS = ["", "Beginner", "Intermediate", "Advanced"];
const DIFF_COLORS = ["", "bg-emerald-500/10 text-emerald-400 border-emerald-500/20", "bg-amber-500/10 text-amber-400 border-amber-500/20", "bg-rose-500/10 text-rose-400 border-rose-500/20"];

/* ═══════════════════════════════════════════
   CODE BLOCK COMPONENT
   ═══════════════════════════════════════════ */
function CodeBlock({ code, step, darkTheme }) {
  const lines = code.split("\n");
  const hl = step?.lineHighlight ?? -1;

  return (
    <div className={`font-mono text-sm border rounded-xl p-4 overflow-x-auto leading-relaxed shadow-inner ${
      darkTheme ? "bg-slate-950/70 border-slate-800 text-slate-300" : "bg-white border-slate-200 text-slate-800"
    }`}>
      {lines.map((line, idx) => {
        const active = hl === idx;
        
        let annotation = "";
        if (active && step) {
          if (step.phase === "init" || step.phase === "mutate" || step.phase === "access") {
            const dictStr = step.vars.D ? JSON.stringify(step.vars.D) : "";
            const otherVars = Object.entries(step.vars)
              .filter(([k]) => k !== "D")
              .map(([k, v]) => `${k}=${JSON.stringify(v)}`)
              .join(", ");
            annotation = [dictStr ? `D=${dictStr}` : "", otherVars].filter(Boolean).join(", ");
          } else if (step.phase === "traverse") {
            const keys = Object.keys(step.vars).filter(k => k !== "D");
            annotation = keys.map(k => `${k}=${JSON.stringify(step.vars[k])}`).join(", ");
          } else if (step.phase === "print") {
            annotation = step.stdout ? `stdout: ${JSON.stringify(step.stdout)}` : "";
          } else if (step.phase === "error") {
            annotation = "KeyError / TypeError!";
          }
        }

        return (
          <div
            key={idx}
            className={`flex items-center justify-between px-3 py-1 rounded transition-all duration-200 border-l-4 ${
              active
                ? "bg-indigo-500/10 text-indigo-300 border-indigo-500 shadow-[0_0_10px_rgba(99,102,241,0.05)]"
                : `border-transparent ${darkTheme ? "text-slate-300" : "text-slate-600"}`
            }`}
          >
            <span className="whitespace-pre">{line}</span>
            {annotation && (
              <span className="ml-4 px-2 py-0.5 rounded text-[11px] font-bold bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
                # {annotation}
              </span>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ═══════════════════════════════════════════
   KEY VALUE PAIR CARD COMPONENT
   ═══════════════════════════════════════════ */
function KeyValuePairCard({ k, val, isPointer, darkTheme }) {
  return (
    <div className="flex items-center gap-2 select-none relative group my-2">
      {/* Pointer arrow marker */}
      {isPointer && (
        <div className="absolute -left-6 top-1/2 -translate-y-1/2 animate-bounce">
          <svg className="w-5 h-5 text-indigo-400 fill-current rotate-90" viewBox="0 0 20 20">
            <path d="M10 3a1 1 0 01.7.3l5 5a1 1 0 01-1.4 1.4L11 6.4V16a1 1 0 11-2 0V6.4L5.7 9.7a1 1 0 01-1.4-1.4l5-5A1 1 0 0110 3z"/>
          </svg>
        </div>
      )}

      {/* Dictionary Pair Card container */}
      <div
        className={`flex items-center border rounded-xl overflow-hidden shadow-lg transition-all duration-300 ${
          isPointer
            ? "bg-indigo-500/25 border-indigo-400 shadow-indigo-500/10 scale-105"
            : `${darkTheme ? "bg-slate-900 border-slate-800" : "bg-white border-slate-200"} hover:border-slate-500`
        }`}
      >
        {/* Key box */}
        <div className={`font-mono text-xs font-extrabold px-3 py-3 border-r min-w-[70px] text-center ${
          darkTheme ? "bg-amber-500/10 text-amber-400 border-slate-800" : "bg-amber-500/5 text-amber-600 border-slate-200"
        }`}>
          {k}
        </div>
        {/* Link symbol */}
        <div className="text-slate-500 px-2 font-bold font-mono">➔</div>
        {/* Value box */}
        <div className={`font-mono text-xs font-bold px-4 py-3 min-w-[90px] text-center ${
          darkTheme ? "bg-cyan-500/10 text-cyan-300" : "bg-cyan-500/5 text-cyan-600"
        }`}>
          {typeof val === "object" ? JSON.stringify(val) : String(val)}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   MAIN VISUALIZER APP
   ═══════════════════════════════════════════ */
function App() {
  const [exIdx, setExIdx] = useState(0);
  const [stepIdx, setStepIdx] = useState(-1);
  const [playing, setPlaying] = useState(false);
  const [speedIdx, setSpeedIdx] = useState(1);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [filterCat, setFilterCat] = useState("All");
  const [darkTheme, setDarkTheme] = useState(true);
  const [brightness, setBrightness] = useState(100);
  const timerRef = useRef(null);

  const ex = EXERCISES[exIdx];
  const steps = ex.steps;
  const currentStep = stepIdx >= 0 && stepIdx < steps.length ? steps[stepIdx] : null;

  const pointers = currentStep?.pointers || [];

  const theme = useMemo(() => darkTheme ? {
    bg: "bg-[#07080e] text-[#cdd6f4]",
    header: "bg-[#0c0d15] border-slate-900",
    sidebar: "bg-[#0b0c14] border-slate-900/60",
    mainCard: "bg-slate-950/40 border-slate-900",
    scopeCard: "bg-slate-950/40 border-slate-900",
    traceCard: "bg-slate-950/40 border-slate-900",
    console: "bg-[#030408] border-slate-950 text-emerald-400",
    textMuted: "text-slate-400",
    textTitle: "text-indigo-300",
    buttonSec: "bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700/60",
    listItem: (active) => active ? "bg-indigo-500/5 text-indigo-300 border-indigo-500" : "border-transparent text-slate-400 hover:bg-slate-900/40 hover:text-slate-300",
    navBtn: "bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700/60",
    themeToggleBtn: "bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700/60",
    conceptHint: "bg-indigo-500/5 border-indigo-500/20 text-slate-300"
  } : {
    bg: "bg-[#f4f5fa] text-[#1e1e2e]",
    header: "bg-[#ffffff] border-slate-250 shadow-sm",
    sidebar: "bg-[#fcfcfd] border-slate-200",
    mainCard: "bg-white border-slate-200 shadow-sm",
    scopeCard: "bg-white border-slate-200 shadow-sm",
    traceCard: "bg-white border-slate-200 shadow-sm",
    console: "bg-[#fcfcfd] border-slate-200 text-emerald-700 shadow-inner",
    textMuted: "text-slate-500",
    textTitle: "text-indigo-600",
    buttonSec: "bg-slate-100 hover:bg-slate-200 text-slate-700 border-slate-300",
    listItem: (active) => active ? "bg-indigo-500/10 text-indigo-600 border-indigo-500 font-extrabold" : "border-transparent text-slate-600 hover:bg-slate-150 hover:text-slate-800",
    navBtn: "bg-slate-100 hover:bg-slate-200 text-slate-800 border-slate-300",
    themeToggleBtn: "bg-slate-100 hover:bg-slate-200 text-slate-700 border-slate-300",
    conceptHint: "bg-indigo-500/10 border-indigo-500/30 text-slate-700"
  }, [darkTheme]);
  
  const advance = useCallback(() => {
    setStepIdx(prev => {
      if (prev >= steps.length - 1) {
        setPlaying(false);
        return prev;
      }
      return prev + 1;
    });
  }, [steps.length]);

  useEffect(() => {
    if (playing) {
      timerRef.current = setInterval(advance, SPEEDS[speedIdx].ms);
    }
    return () => clearInterval(timerRef.current);
  }, [playing, speedIdx, advance]);

  const stepFwd = () => {
    if (stepIdx < steps.length - 1) setStepIdx(stepIdx + 1);
  };
  const stepBack = () => {
    if (stepIdx > -1) setStepIdx(stepIdx - 1);
  };
  const togglePlay = () => {
    if (stepIdx >= steps.length - 1) {
      setStepIdx(-1);
      setTimeout(() => setPlaying(true), 60);
      return;
    }
    setPlaying(!playing);
  };
  const reset = () => {
    setStepIdx(-1);
    setPlaying(false);
  };

  const handleSelectExercise = (idx) => {
    setExIdx(idx);
    setStepIdx(-1);
    setPlaying(false);
    setSidebarOpen(false);
  };

  const filteredExercises = filterCat === "All" ? EXERCISES : EXERCISES.filter(e => e.cat === filterCat);

  let phaseLabel = "READY";
  let phaseColor = "text-slate-400 bg-slate-500/10 border-slate-500/20";
  if (currentStep) {
    if (currentStep.phase === "init") {
      phaseLabel = "INITIALIZE";
      phaseColor = "text-yellow-400 bg-yellow-500/10 border-yellow-500/20";
    } else if (currentStep.phase === "access") {
      phaseLabel = "LOOKUP / ACCESS";
      phaseColor = "text-cyan-400 bg-cyan-500/10 border-cyan-500/20";
    } else if (currentStep.phase === "mutate") {
      phaseLabel = "MUTATION / WRITE";
      phaseColor = "text-rose-400 bg-rose-500/10 border-rose-500/20";
    } else if (currentStep.phase === "traverse") {
      phaseLabel = "TRAVERSAL";
      phaseColor = "text-indigo-400 bg-indigo-500/10 border-indigo-500/20";
    } else if (currentStep.phase === "print") {
      phaseLabel = "PRINT / OUTPUT";
      phaseColor = "text-emerald-400 bg-emerald-500/10 border-emerald-500/20";
    } else if (currentStep.phase === "error" || currentStep.hasError) {
      phaseLabel = "CRASH EXCEPTION";
      phaseColor = "text-rose-400 bg-rose-500/10 border-rose-500/30 animate-pulse";
    }
  }

  const currentDict = currentStep ? currentStep.dict : {};
  const entries = Object.entries(currentDict);

  return (
    <div className={`min-h-screen flex flex-col ${theme.bg}`} style={{ filter: `brightness(${brightness}%)` }}>
      {/* TOP HEADER BAR */}
      <header className={`flex items-center gap-4 px-6 py-4 border-b shadow-md ${theme.header}`}>
        <button
          onClick={() => setSidebarOpen(!sidebarOpen)}
          className={`px-3 py-2 text-xl rounded-xl transition duration-150 ${theme.buttonSec}`}
        >
          {sidebarOpen ? "✕" : "☰"}
        </button>
        <div className="flex-1">
          <div className="flex items-center gap-3">
            <h1 className={`font-extrabold text-[16px] tracking-wider font-mono ${theme.textTitle}`}>
              PYTHON DICTIONARY VISUALIZER
            </h1>
            <span className={`text-[12px] font-mono px-2 py-0.5 rounded-md ${darkTheme ? "bg-slate-900 text-slate-400 border border-slate-800" : "bg-slate-100 text-slate-600 border border-slate-200"}`}>
              CBSE IP XI (065)
            </span>
          </div>
          <p className="text-xs text-slate-400 font-semibold mt-0.5">
            Topic {exIdx + 1}: {ex.name}
          </p>
        </div>
        <div className={`px-3 py-1 rounded-full border text-[11px] font-extrabold tracking-wider ${DIFF_COLORS[ex.difficulty]}`}>
          {DIFF_LABELS[ex.difficulty].toUpperCase()}
        </div>
        
        {/* Brightness Control Slider */}
        <div className={`flex items-center gap-2 px-3 py-1.5 rounded-xl border text-xs font-semibold ${
          darkTheme ? "bg-slate-800/60 border-slate-700/60 text-slate-200" : "bg-slate-100 border-slate-300 text-slate-700"
        }`}>
          <span className="select-none font-bold">🔆 Brightness:</span>
          <input
            type="range"
            min="30"
            max="100"
            value={brightness}
            onChange={(e) => setBrightness(Number(e.target.value))}
            className="w-20 accent-indigo-500 cursor-pointer h-1.5 bg-slate-900 rounded-lg appearance-none"
          />
          <span className="font-mono font-bold w-8 text-right select-none">{brightness}%</span>
        </div>

        <button
          onClick={() => setDarkTheme(!darkTheme)}
          className={`px-3 py-1.5 border rounded-xl text-xs font-extrabold transition duration-150 ${theme.themeToggleBtn}`}
        >
          {darkTheme ? "☀️ LIGHT" : "🌙 DARK"}
        </button>
      </header>

      {/* BODY CONTENT */}
      <div className="flex flex-1 relative overflow-hidden">
        {/* SLIDE SIDEBAR */}
        <aside
          className={`absolute top-0 bottom-0 left-0 w-80 border-r z-30 transition-all duration-300 ease-out overflow-y-auto ${theme.sidebar} ${
            sidebarOpen ? "translate-x-0" : "-translate-x-full"
          }`}
        >
          <div className={`flex flex-wrap gap-1.5 p-4 border-b ${darkTheme ? "border-slate-900" : "border-slate-200"}`}>
            {CATEGORIES.map(c => (
              <button
                key={c}
                onClick={() => setFilterCat(c)}
                className={`px-3 py-1 rounded-full text-[11px] font-extrabold transition border duration-150 ${
                  filterCat === c
                    ? "bg-indigo-500 text-slate-950 border-indigo-400"
                    : `${darkTheme ? "bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800" : "bg-slate-100 text-slate-650 border-slate-200 hover:bg-slate-200"}`
                }`}
              >
                {c.toUpperCase()}
              </button>
            ))}
          </div>

          <div className="py-2">
            {filteredExercises.map(item => {
              const globalIdx = EXERCISES.indexOf(item);
              const active = globalIdx === exIdx;
              return (
                <button
                  key={globalIdx}
                  onClick={() => handleSelectExercise(globalIdx)}
                  className={`w-full flex items-center gap-3 px-6 py-3 border-l-4 text-left transition duration-150 ${theme.listItem(active)}`}
                >
                  <span className="font-mono text-xs text-slate-500 font-bold">
                    {String(globalIdx + 1).padStart(2, "0")}
                  </span>
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-semibold truncate">{item.name}</div>
                    <span className="text-[10px] text-slate-500">{item.cat}</span>
                  </div>
                  <span className={`w-2 h-2 rounded-full ${
                    item.difficulty === 1 ? "bg-emerald-500" : item.difficulty === 2 ? "bg-amber-500" : "bg-rose-500"
                  }`} />
                </button>
              );
            })}
          </div>
        </aside>

        {/* MAIN VISUAL WORKSPACE */}
        <main className="flex-1 flex flex-col p-6 overflow-y-auto gap-5">
          {/* CONCEPT HINT CARD */}
          <div className={`p-4 border rounded-2xl flex items-start gap-3 ${theme.conceptHint}`}>
            <span className="text-xl">💡</span>
            <div>
              <h3 className="text-xs font-extrabold text-indigo-400 tracking-wider uppercase mb-1">Concept Hint</h3>
              <p className="text-sm leading-relaxed font-medium">{ex.hint}</p>
            </div>
          </div>

          {/* DYNAMIC DICTIONARY MAPPING MEMORY GRID */}
          <div className={`p-6 border rounded-2xl flex flex-col gap-4 shadow-sm min-h-[160px] justify-center relative ${theme.mainCard}`}>
            <div className="flex justify-between items-center">
              <h3 className="text-xs font-bold text-slate-500 tracking-widest uppercase">Dictionary Key-Value Mapping</h3>
              <span className="text-[10px] text-rose-400 bg-rose-500/10 border border-rose-500/25 px-2.5 py-0.5 rounded font-extrabold font-mono tracking-wider">
                ⚠️ UNORDERED · NO INDEXES
              </span>
            </div>
            
            {entries.length === 0 ? (
              <div className={`flex items-center justify-center p-6 border border-dashed rounded-xl ${darkTheme ? "bg-slate-900/30 border-slate-800 text-slate-650" : "bg-slate-50/80 border-slate-200 text-slate-400"}`}>
                <span className="font-mono text-sm font-semibold">D = {} (Empty Dictionary)</span>
              </div>
            ) : (
              <div className="flex flex-wrap items-center gap-6 justify-center">
                {entries.map(([k, val]) => (
                  <KeyValuePairCard
                    key={k}
                    k={k}
                    val={val}
                    isPointer={pointers.includes(k)}
                    darkTheme={darkTheme}
                  />
                ))}
              </div>
            )}
          </div>

          {/* CODE BLOCK & VARIABLES HUD */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <div className="lg:col-span-2 flex flex-col gap-2">
              <h3 className="text-xs font-bold text-slate-500 tracking-widest uppercase pl-1">Python Source Code</h3>
              <CodeBlock code={ex.code} step={currentStep} darkTheme={darkTheme} />
            </div>

            <div className="flex flex-col gap-2">
              <h3 className="text-xs font-bold text-slate-500 tracking-widest uppercase pl-1">Variables Scope</h3>
              <div className={`flex-1 border rounded-xl p-4 flex flex-col gap-3 font-mono text-sm shadow-inner ${theme.scopeCard}`}>
                {currentStep && Object.keys(currentStep.vars).length > 0 ? (
                  Object.entries(currentStep.vars).map(([name, val]) => (
                    <div key={name} className={`flex justify-between border-b pb-2 ${darkTheme ? "border-slate-900" : "border-slate-100"}`}>
                      <span className="text-indigo-400 font-extrabold">{name}</span>
                      <span className={`font-bold truncate max-w-[150px] ${darkTheme ? "text-slate-300" : "text-slate-700"}`}>
                        {JSON.stringify(val)}
                      </span>
                    </div>
                  ))
                ) : (
                  <div className={`flex items-center justify-center flex-grow text-xs italic font-semibold ${darkTheme ? "text-slate-600" : "text-slate-400"}`}>
                    # No variables initialized
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* LOGGING & STDOUT PANEL */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <div className="lg:col-span-2 flex flex-col gap-2">
              <h3 className="text-xs font-bold text-slate-500 tracking-widest uppercase pl-1">Under the hood trace</h3>
              <div className={`p-4 rounded-xl border flex items-center min-h-[50px] font-medium text-sm transition-all duration-200 ${phaseColor}`}>
                {currentStep ? currentStep.desc : "Click Play or Step Forward to trace execution."}
              </div>
            </div>

            <div className="flex flex-col gap-2">
              <h3 className="text-xs font-bold text-slate-500 tracking-widest uppercase pl-1">stdout terminal</h3>
              <div className={`rounded-xl p-3 min-h-[50px] font-mono text-xs shadow-inner whitespace-pre-wrap ${theme.console}`}>
                {currentStep?.stdout ? currentStep.stdout : "# Standard output is empty"}
              </div>
            </div>
          </div>

          {/* CONTROLS PANEL */}
          <div className={`border rounded-2xl p-4 flex flex-wrap gap-4 items-center justify-between shadow-sm ${theme.mainCard}`}>
            <div className="flex items-center gap-3">
              <button
                onClick={stepBack}
                disabled={stepIdx <= -1}
                className={`w-10 h-10 flex items-center justify-center rounded-xl border transition disabled:opacity-40 ${theme.navBtn}`}
              >
                ◀
              </button>
              <button
                onClick={togglePlay}
                className={`px-6 h-10 rounded-xl text-slate-950 font-extrabold text-sm tracking-wide transition ${
                  playing ? "bg-rose-400 hover:bg-rose-500" : "bg-emerald-400 hover:bg-emerald-500"
                }`}
              >
                {playing ? "⏸ PAUSE" : stepIdx >= steps.length - 1 ? "↺ REPLAY" : "▶ PLAY"}
              </button>
              <button
                onClick={stepFwd}
                disabled={stepIdx >= steps.length - 1 || currentStep?.hasError}
                className={`w-10 h-10 flex items-center justify-center rounded-xl border transition disabled:opacity-40 ${theme.navBtn}`}
              >
                ▶
              </button>
              <button
                onClick={reset}
                className={`w-10 h-10 flex items-center justify-center rounded-xl border transition ${theme.navBtn}`}
                title="Reset simulation"
              >
                ⟲
              </button>
            </div>

            <div className={`flex items-center gap-1 p-1 border rounded-xl ${darkTheme ? "bg-slate-900 border-slate-800" : "bg-slate-100 border-slate-200"}`}>
              {SPEEDS.map((s, idx) => (
                <button
                  key={idx}
                  onClick={() => setSpeedIdx(idx)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition duration-150 ${
                    idx === speedIdx
                      ? "bg-indigo-500 text-slate-950"
                      : `${darkTheme ? "text-slate-400 hover:bg-slate-800 hover:text-slate-300" : "text-slate-500 hover:bg-slate-200 hover:text-slate-700"}`
                  }`}
                >
                  {s.label}
                </button>
              ))}
            </div>

            <div className={`px-4 py-1.5 rounded-xl border text-[11px] font-extrabold tracking-wider ${phaseColor}`}>
              {phaseLabel}
            </div>
          </div>

          {/* Prev / Next Exercise Navigation */}
          <div className={`flex justify-between items-center pt-4 pb-8 border-t mt-4 ${darkTheme ? "border-slate-900/60" : "border-slate-200"}`}>
            <button
              disabled={exIdx === 0}
              onClick={() => handleSelectExercise(exIdx - 1)}
              className={`px-5 py-2.5 rounded-xl border text-sm font-bold disabled:opacity-40 transition flex items-center gap-2 ${theme.navBtn}`}
            >
              ← Prev Exercise
            </button>
            
            <span className="text-xs text-slate-500 font-mono font-bold">
              EXERCISE {exIdx + 1} OF {EXERCISES.length}
            </span>

            <button
              disabled={exIdx === EXERCISES.length - 1}
              onClick={() => handleSelectExercise(exIdx + 1)}
              className="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/60 rounded-xl text-sm font-bold disabled:opacity-40 disabled:hover:bg-slate-800 transition flex items-center gap-2"
            >
              Next Exercise →
            </button>
          </div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
